
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | GG Streetwear</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: #111;
      color: white;
      min-height: 100vh;
    }

    .cart-section {
      max-width: 1000px;
      width: 90%;
      margin: 60px auto;
      min-height: 55vh;
    }

    .cart-section h1 {
      font-size: 38px;
      margin-bottom: 30px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 20px;
      background: #202020;
      border: 1px solid #333;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 5px;
    }

    .cart-item img {
      width: 100px;
      height: 110px;
      object-fit: cover;
      background: #333;
    }

    .item-info {
      flex: 1;
    }

    .item-info h3 {
      margin-bottom: 10px;
    }

    .item-price {
      color: #aaa;
      margin-bottom: 10px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    .quantity-controls button {
      width: 30px;
      height: 30px;
      background: #444;
      color: white;
      border: none;
      font-size: 18px;
    }

    .quantity-controls span {
      min-width: 20px;
      text-align: center;
    }

    .remove-btn {
      background: transparent;
      border: 1px solid #777;
      color: white;
      padding: 9px 13px;
      cursor: pointer;
    }

    .remove-btn:hover {
      background: #555;
    }

    .cart-summary {
      background: #202020;
      border: 1px solid #333;
      padding: 25px;
      margin-top: 30px;
      border-radius: 5px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      color: #bbb;
    }

    .summary-total {
      border-top: 1px solid #444;
      padding-top: 18px;
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    .cart-buttons {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 25px;
    }

    .cart-buttons a,
    .checkout-btn {
      text-align: center;
      padding: 13px 20px;
      background: #444;
      color: white;
      border: 1px solid #666;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
    }

    .cart-buttons a:hover,
    .checkout-btn:hover {
      background: #666;
    }

    .empty-cart {
      text-align: center;
      background: #202020;
      padding: 50px 20px;
      color: #aaa;
      border: 1px solid #333;
    }

    .empty-cart h2 {
      color: white;
      margin-bottom: 15px;
    }

    @media (max-width: 600px) {
      .cart-item {
        flex-wrap: wrap;
      }

      .cart-item img {
        width: 80px;
        height: 90px;
      }

      .cart-buttons {
        flex-direction: column;
      }

      .cart-section h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="logo-street.png" alt="GG Streetwear Logo" class="logo-img">
      </a>

      <nav class="main-nav">
        <ul>
          <li><a href="index.html#hero">Home</a></li>
          <li><a href="index.html#shop">Shop</a></li>
          <li><a href="index.html#footer">Contact</a></li>
        </ul>
      </nav>

      <a href="cart.html" class="btn btn-small">
        Cart (<span id="cart-count">0</span>)
      </a>
    </div>
  </header>

  <!-- CART SECTION -->
  <main class="cart-section">

    <h1>YOUR SHOPPING CART</h1>

    <div id="cart-items"></div>

    <div id="cart-summary" class="cart-summary" hidden>

      <div class="summary-row">
        <span>Total Items</span>
        <span id="total-items">0</span>
      </div>

      <div class="summary-row">
        <span>Subtotal</span>
        <span id="subtotal">₱0.00</span>
      </div>

      <div class="summary-row summary-total">
        <span>Total</span>
        <span id="total-price">₱0.00</span>
      </div>

      <div class="cart-buttons">
        <a href="index.html#shop">CONTINUE SHOPPING</a>
        <button class="checkout-btn" onclick="checkout()">
          CHECKOUT
        </button>
      </div>

    </div>

  </main>

  <!-- FOOTER -->
  <footer id="footer">
    <div class="footer-bottom">
      <p>© 2026 GG STREETWEAR. All Rights Reserved.</p>
    </div>
  </footer>

  <script>
    
// GET CART DATA
let cart = JSON.parse(localStorage.getItem("ggCart")) || [];

// FIX OLD OR INVALID CART DATA
cart = cart.map(item => ({
  name: item.name,
  price: Number(item.price) || 0,
  image: item.image || "",
  quantity: Math.max(1, Number(item.quantity) || 1)
}));

localStorage.setItem("ggCart", JSON.stringify(cart));

// FORMAT PRICE
function formatPrice(price) {
  return "₱" + price.toLocaleString("en-PH", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

// DISPLAY CART
function displayCart() {
  const cartItems = document.getElementById("cart-items");
  const summary = document.getElementById("cart-summary");

  const totalItems = cart.reduce(
    (sum, item) => sum + item.quantity, 0
  );

  const totalPrice = cart.reduce(
    (sum, item) => sum + item.price * item.quantity, 0
  );

  document.getElementById("cart-count").textContent = totalItems;

  if (cart.length === 0) {
    cartItems.innerHTML = `
      <div class="empty-cart">
        <h2>Your Cart is Empty</h2>
        <p>You haven't added any products yet.</p>
        <br>
        <a href="index.html#shop" class="btn">
          START SHOPPING
        </a>
      </div>
    `;

    summary.hidden = true;
    return;
  }

  summary.hidden = false;
  cartItems.innerHTML = "";

  cart.forEach((item, index) => {
    const product = document.createElement("div");
    product.className = "cart-item";

    const image = document.createElement("img");
    image.src = item.image;
    image.alt = item.name;

    const info = document.createElement("div");
    info.className = "item-info";

    const name = document.createElement("h3");
    name.textContent = item.name;

    const price = document.createElement("p");
    price.className = "item-price";
    price.textContent = formatPrice(item.price);

    const controls = document.createElement("div");
    controls.className = "quantity-controls";

    const decrease = document.createElement("button");
    decrease.textContent = "-";
    decrease.onclick = () => changeQuantity(index, -1);

    const quantity = document.createElement("span");
    quantity.textContent = item.quantity;

    const increase = document.createElement("button");
    increase.textContent = "+";
    increase.onclick = () => changeQuantity(index, 1);

    const remove = document.createElement("button");
    remove.className = "remove-btn";
    remove.textContent = "REMOVE";
    remove.onclick = () => removeItem(index);

    controls.append(decrease, quantity, increase);
    info.append(name, price, controls);
    product.append(image, info, remove);

    cartItems.appendChild(product);
  });

  // UPDATE TOTALS
  document.getElementById("total-items").textContent = totalItems;

  document.getElementById("subtotal").textContent =
    formatPrice(totalPrice);

  document.getElementById("total-price").textContent =
    formatPrice(totalPrice);
}

// SAVE CART
function saveCart() {
  localStorage.setItem("ggCart", JSON.stringify(cart));
  displayCart();
}

// CHANGE QUANTITY
function changeQuantity(index, amount) {
  cart[index].quantity += amount;

  if (cart[index].quantity <= 0) {
    cart.splice(index, 1);
  }

  saveCart();
}

// REMOVE PRODUCT
function removeItem(index) {
  cart.splice(index, 1);
  saveCart();
}

// CHECKOUT
function checkout() {
  if (cart.length === 0) {
    alert("Your cart is empty!");
    return;
  }

  const totalItems = cart.reduce(
    (sum, item) => sum + item.quantity, 0
  );

  const totalPrice = cart.reduce(
    (sum, item) => sum + item.price * item.quantity, 0
  );

  alert(
    "GG STREETWEAR ORDER SUMMARY\n\n" +
    "Total Products: " + totalItems + "\n" +
    "Total Amount: " + formatPrice(totalPrice) +
    "\n\nThank you for shopping with us!"
  );
}

// INITIALIZE
displayCart();

  </script>

</body>
</html>
